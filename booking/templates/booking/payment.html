{% extends 'booking/base.html' %}

{% block title %}
Payment
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    💳 Payment
                </h2>

                <form>

                    <div class="mb-3">
                        <label class="form-label">
                            Card Holder Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter card holder name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Card Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="1234 5678 9012 3456">
                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                Expiry Date
                            </label>

                            <input
                                type="month"
                                class="form-control">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                CVV
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                maxlength="3"
                                placeholder="123">

                        </div>

                    </div>

                    <div class="mt-4 d-flex justify-content-between">

                        <a href="{% url 'booking' %}" class="btn btn-secondary">
                            ← Back
                        </a>

                        <a href="#" class="btn btn-success">
                            Pay Now
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
