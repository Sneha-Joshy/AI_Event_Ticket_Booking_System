{% extends 'booking/base.html' %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 500px;">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            🔐 Admin Login
        </h2>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter admin username"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter admin password"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-dark w-100">

                🔐 Login as Admin

            </button>

        </form>

    </div>

</div>

{% endblock %}
