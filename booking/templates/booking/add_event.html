{% extends 'booking/base.html' %}

{% block title %}
Add Event
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            ➕ Add New Event
        </h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Event Name -->
            <div class="mb-3">

                <label class="form-label">
                    Event Name
                </label>

                <input
                    type="text"
                    name="event_name"
                    class="form-control"
                    placeholder="Enter Event Name"
                    required
                >

            </div>


            <!-- Category -->
            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    name="category"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="Music">
                        Music
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Food Festival">
                        Food Festival
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Seminar">
                        Seminar
                    </option>

                    <option value="Conference">
                        Conference
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Cultural Event">
                        Cultural Event
                    </option>

                    <option value="Comedy Show">
                        Comedy Show
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="College Fest">
                        College Fest
                    </option>

                </select>

            </div>


            <!-- Description -->
            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="4"
                    class="form-control"
                    placeholder="Enter Event Description"
                    required
                ></textarea>

            </div>


            <!-- Event Date and Time -->
            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">
                        Event Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Event Time
                    </label>

                    <input
                        type="time"
                        name="time"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <!-- Booking Deadline and Event Type -->
            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Booking Deadline
                    </label>

                    <div class="form-control bg-light">

                        Automatically closes 1 hour
                        before the event

                    </div>

                    <small class="text-muted">

                        The system automatically calculates
                        the booking deadline.

                    </small>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Event Type
                    </label>

                    <select
                        name="event_type"
                        class="form-select"
                        required
                    >

                        <option value="Offline">
                            Offline
                        </option>

                        <option value="Online">
                            Online
                        </option>

                        <option value="Hybrid">
                            Hybrid
                        </option>

                    </select>

                </div>

            </div>


            <!-- Venue -->
            <div class="mb-3 mt-3">

                <label class="form-label">
                    Venue
                </label>

                <input
                    type="text"
                    name="venue"
                    class="form-control"
                    placeholder="Enter Venue"
                    required
                >

            </div>


            <!-- Contact Number -->
            <div class="mb-3">

                <label class="form-label">
                    Organizer Contact Number
                </label>

                <input
                    type="tel"
                    name="contact_number"
                    class="form-control"
                    pattern="[6-9][0-9]{9}"
                    maxlength="10"
                    placeholder="Enter 10-digit mobile number"
                    required
                >

            </div>


            <!-- Ticket Price and Seats -->
            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">
                        Ticket Price (₹)
                    </label>

                    <input
                        type="number"
                        name="ticket_price"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Total Seats
                    </label>

                    <input
                        type="number"
                        name="total_seats"
                        class="form-control"
                        min="1"
                        required
                    >

                </div>

            </div>


            <!-- Event Image -->
            <div class="mb-3 mt-3">

                <label class="form-label">
                    Event Image
                </label>

                <input
                    type="file"
                    name="image"
                    class="form-control"
                    accept="image/*"
                    required
                >

            </div>


            <!-- Terms and Conditions -->
            <div class="mb-3">

                <label class="form-label">
                    Terms & Conditions
                </label>

                <textarea
                    name="terms"
                    rows="4"
                    class="form-control"
                    placeholder="Enter event rules (optional)"
                ></textarea>

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="btn btn-success w-100"
            >

                Submit Event

            </button>

        </form>

    </div>

</div>

{% endblock %}
