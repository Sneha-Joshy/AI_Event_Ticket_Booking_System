{% extends 'booking/base.html' %}

{% block title %}
Book Ticket
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    🎫 Book Your Ticket
                </h2>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Event Name -->
                    <div class="mb-3">
                        <label class="form-label">
                            Event Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ event.event_name }}"
                            readonly>
                    </div>

                    <!-- Ticket Price -->
                    <div class="mb-3">
                        <label class="form-label">
                            Ticket Price
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="₹{{ event.ticket_price }}"
                            readonly>
                    </div>

                    <!-- Number of Tickets -->
                    <div class="mb-3">
                        <label class="form-label">
                            Number of Tickets
                        </label>

                        <input
                            type="number"
                            name="tickets"
                            class="form-control"
                            min="1"
                            max="{{ event.available_seats }}"
                            value="1"
                            required>
                    </div>

                    <!-- Total Amount -->
                    <div class="mb-3">
                        <label class="form-label">
                            Total Amount
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="₹{{ event.ticket_price }}"
                            readonly>
                    </div>

                    <!-- Customer Name -->
                    <div class="mb-3">
                        <label class="form-label">
                            Customer Name
                        </label>

                        <input
                            type="text"
                            name="customer_name"
                            class="form-control"
                            placeholder="Enter your name"
                            required>
                    </div>

                    <!-- Customer Email -->
                    <div class="mb-3">
                        <label class="form-label">
                            Customer Email
                        </label>

                        <input
                            type="email"
                            name="customer_email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <!-- Buttons -->
                    <div class="text-center">

                        <a href="{% url 'event_details' event.id %}" class="btn btn-secondary">
                            ← Back
                        </a>

                        <button type="submit" class="btn btn-warning btn-lg">
                            Proceed to Payment
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
