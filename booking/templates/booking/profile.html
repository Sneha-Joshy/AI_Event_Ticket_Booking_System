{% extends 'booking/base.html' %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">My Profile</h1>
        <p class="text-muted">
            Manage your account information and bookings.
        </p>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center">

                        <img src="https://i.pravatar.cc/180"
                             class="rounded-circle border shadow mb-3"
                             width="150"
                             height="150"
                             alt="Profile">

                        <h3>John Doe</h3>
                        <p class="text-muted">
                            Event Enthusiast
                        </p>

                    </div>

                    <hr>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   value="John Doe"
                                   readonly>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Email</label>
                            <input type="email"
                                   class="form-control"
                                   value="john@example.com"
                                   readonly>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Phone Number</label>
                            <input type="text"
                                   class="form-control"
                                   value="+91 9876543210"
                                   readonly>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">City</label>
                            <input type="text"
                                   class="form-control"
                                   value="Kochi"
                                   readonly>
                        </div>

                    </div>

                    <div class="text-center mt-4">

                        <a href="#" class="btn btn-primary me-2">
                            Edit Profile
                        </a>

                        <a href="{% url 'my_bookings' %}" class="btn btn-success me-2">
                            My Bookings
                        </a>
                        
                        <a href="#" class="btn btn-outline-secondary">
                            Change Password
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
